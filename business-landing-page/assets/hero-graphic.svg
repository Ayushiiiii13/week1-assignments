<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="100%" height="100%">
  <defs>
    <linearGradient id="lHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="650" height="480" rx="20" fill="url(#lHeroGrad)"/>

  <!-- Glowing background orb -->
  <circle cx="500" cy="120" r="140" fill="#4338ca" opacity="0.25" filter="blur(40px)"/>
  <circle cx="150" cy="360" r="120" fill="#0891b2" opacity="0.2" filter="blur(40px)"/>

  <!-- Main Showcase Browser / Mockup Window -->
  <g transform="translate(60, 50)">
    <!-- Window Frame -->
    <rect width="520" height="340" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <rect width="520" height="38" rx="14" fill="#1e293b"/>
    <!-- Controls -->
    <circle cx="22" cy="19" r="5" fill="#ef4444"/>
    <circle cx="38" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="19" r="5" fill="#10b981"/>
    <rect x="75" y="10" width="220" height="18" rx="4" fill="#0f172a"/>
    <text x="85" y="23" fill="#64748b" font-family="monospace" font-size="10">lumina-creative.agency/work</text>

    <!-- Inner Dashboard Canvas -->
    <!-- Nav inside mockup -->
    <rect x="25" y="55" width="470" height="24" rx="4" fill="#1e293b" opacity="0.6"/>
    <rect x="35" y="62" width="50" height="10" rx="3" fill="#6366f1"/>
    <rect x="390" y="60" width="95" height="14" rx="3" fill="url(#accentGrad)"/>

    <!-- Hero Card inside mockup -->
    <rect x="25" y="92" width="290" height="135" rx="8" fill="#131b2e" stroke="#1e293b"/>
    <rect x="40" y="110" width="120" height="12" rx="3" fill="#f8fafc"/>
    <rect x="40" y="130" width="210" height="8" rx="2" fill="#64748b"/>
    <rect x="40" y="145" width="180" height="8" rx="2" fill="#475569"/>
    
    <!-- Mini Metric Cards -->
    <rect x="40" y="172" width="90" height="38" rx="6" fill="#1e293b"/>
    <text x="50" y="190" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">+148%</text>
    <text x="50" y="202" fill="#94a3b8" font-family="sans-serif" font-size="8">Conversions</text>

    <rect x="145" y="172" width="90" height="38" rx="6" fill="#1e293b"/>
    <text x="155" y="190" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">99.8%</text>
    <text x="155" y="202" fill="#94a3b8" font-family="sans-serif" font-size="8">Uptime Score</text>

    <!-- Visual Chart on right side of mockup -->
    <rect x="330" y="92" width="165" height="135" rx="8" fill="#131b2e" stroke="#1e293b"/>
    <!-- Bars -->
    <rect x="350" y="175" width="16" height="35" rx="3" fill="#475569"/>
    <rect x="375" y="155" width="16" height="55" rx="3" fill="#6366f1"/>
    <rect x="400" y="140" width="16" height="70" rx="3" fill="#818cf8"/>
    <rect x="425" y="120" width="16" height="90" rx="3" fill="#06b6d4"/>
    <rect x="450" y="105" width="16" height="105" rx="3" fill="url(#accentGrad)"/>

    <!-- Bottom Feature Row inside mockup -->
    <rect x="25" y="240" width="145" height="75" rx="6" fill="#131b2e"/>
    <rect x="37" y="255" width="24" height="24" rx="4" fill="#4338ca"/>
    <rect x="68" y="258" width="80" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="37" y="290" width="120" height="6" rx="2" fill="#64748b"/>

    <rect x="187" y="240" width="145" height="75" rx="6" fill="#131b2e"/>
    <rect x="199" y="255" width="24" height="24" rx="4" fill="#0f766e"/>
    <rect x="230" y="258" width="80" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="199" y="290" width="120" height="6" rx="2" fill="#64748b"/>

    <rect x="350" y="240" width="145" height="75" rx="6" fill="#131b2e"/>
    <rect x="362" y="255" width="24" height="24" rx="4" fill="#c2410c"/>
    <rect x="393" y="258" width="80" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="362" y="290" width="120" height="6" rx="2" fill="#64748b"/>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(420, 375)">
    <rect width="180" height="55" rx="28" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))"/>
    <circle cx="28" cy="27" r="16" fill="#10b981"/>
    <text x="28" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
    <text x="56" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Production Ready</text>
    <text x="56" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Fast &amp; Fully Responsive</text>
  </g>
</svg>
