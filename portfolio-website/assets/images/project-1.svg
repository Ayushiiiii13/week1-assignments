<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bGrad)"/>
  
  <!-- Browser Chrome -->
  <rect width="600" height="42" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <rect x="90" y="10" width="340" height="22" rx="4" fill="#0f172a"/>
  <text x="105" y="25" fill="#a5b4fc" font-family="monospace" font-size="11">https://bridge-able-production.vercel.app</text>

  <!-- BridgeAble App Interface -->
  <!-- Header inside Mockup -->
  <rect x="30" y="65" width="540" height="50" rx="8" fill="#1e1b4b" stroke="#312e81"/>
  <circle cx="55" cy="90" r="14" fill="url(#brandGrad)"/>
  <text x="55" y="95" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">BA</text>
  <text x="80" y="96" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">BridgeAble</text>
  <rect x="440" y="77" width="110" height="26" rx="6" fill="url(#brandGrad)"/>
  <text x="495" y="94" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Explore Impact</text>

  <!-- Hero Content inside mockup -->
  <rect x="30" y="130" width="330" height="220" rx="10" fill="#131b2e" stroke="#1f2937"/>
  <text x="50" y="165" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="18">Bridging Opportunity</text>
  <text x="50" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="12">Empowering communities through accessible</text>
  <text x="50" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="12">resources and peer support networks.</text>
  
  <rect x="50" y="235" width="120" height="34" rx="6" fill="#4f46e5"/>
  <text x="110" y="256" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Get Started</text>

  <!-- Metric badges -->
  <rect x="50" y="290" width="120" height="42" rx="6" fill="#1e293b"/>
  <text x="62" y="310" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">100% Live</text>
  <text x="62" y="324" fill="#94a3b8" font-family="sans-serif" font-size="9">Vercel Production</text>

  <!-- Community Cards on right -->
  <rect x="380" y="130" width="190" height="100" rx="10" fill="#131b2e" stroke="#1f2937"/>
  <circle cx="410" cy="160" r="16" fill="#0284c7"/>
  <text x="410" y="166" fill="#ffffff" font-family="sans-serif" font-size="16" text-anchor="middle">🤝</text>
  <text x="435" y="165" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Peer Network</text>
  <text x="395" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Active volunteers &amp; mentors</text>

  <rect x="380" y="250" width="190" height="100" rx="10" fill="#131b2e" stroke="#1f2937"/>
  <circle cx="410" cy="280" r="16" fill="#7c3aed"/>
  <text x="410" y="286" fill="#ffffff" font-family="sans-serif" font-size="16" text-anchor="middle">📚</text>
  <text x="435" y="285" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Resource Hub</text>
  <text x="395" y="315" fill="#94a3b8" font-family="sans-serif" font-size="10">Curated study pathways</text>
</svg>
