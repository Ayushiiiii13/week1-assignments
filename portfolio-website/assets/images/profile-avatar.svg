<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b5"/>
      <stop offset="100%" stop-color="#f5be98"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Subtle tech grid background -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Developer Silhouette / Avatar -->
  <!-- Shoulders / Torso -->
  <path d="M110 370 C 110 290, 290 290, 290 370 Z" fill="url(#shirtGrad)" />
  <!-- Neck -->
  <rect x="175" y="220" width="50" height="60" rx="8" fill="url(#skinGrad)" />
  <!-- Collar -->
  <path d="M175 250 L200 280 L225 250 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Head -->
  <ellipse cx="200" cy="175" rx="55" ry="65" fill="url(#skinGrad)" />
  
  <!-- Hair -->
  <path d="M142 165 C 135 110, 190 90, 250 110 C 265 115, 260 150, 255 170 C 248 140, 230 130, 200 130 C 170 130, 155 145, 142 165 Z" fill="#1e293b" />
  
  <!-- Modern glasses -->
  <rect x="155" y="160" width="36" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="209" y="160" width="36" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <line x1="191" y1="172" x2="209" y2="172" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Eyes -->
  <circle cx="173" cy="172" r="3.5" fill="#0f172a" />
  <circle cx="227" cy="172" r="3.5" fill="#0f172a" />
  
  <!-- Smile -->
  <path d="M185 205 Q200 218 215 205" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  <!-- Code badges floating -->
  <g transform="translate(45, 120)">
    <rect width="70" height="32" rx="8" fill="#1e293b" opacity="0.9" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="35" y="21" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">&lt;code/&gt;</text>
  </g>
  <g transform="translate(285, 230)">
    <rect width="65" height="32" rx="8" fill="#1e293b" opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="21" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">CSS3</text>
  </g>
</svg>
